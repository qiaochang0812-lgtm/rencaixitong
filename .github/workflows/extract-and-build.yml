name: 解压源码并构建 APK

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: '要解压的 zip 文件名（留空则自动找根目录第一个 .zip）'
        required: false
        default: ''
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: extract-and-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 定位 zip 文件
        id: zip
        env:
          INPUT_ZIP: ${{ inputs.zip_name }}
        run: |
          ZIP=""
          if [ -n "$INPUT_ZIP" ]; then
            ZIP="$INPUT_ZIP"
          else
            ZIP=$(find . -maxdepth 1 -name '*.zip' -type f | head -n 1)
          fi
          ZIP="${ZIP#./}"
          if [ -n "$ZIP" ] && [ ! -f "$ZIP" ]; then
            echo "::error::找不到指定的 zip：$ZIP"; exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip 文件：${ZIP:-（无，直接用仓库源码构建）}"

      - name: 解压到代码区
        if: steps.zip.outputs.zip != ''
        env:
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted

          # Windows 打的 zip 路径用反斜杠，unzip 会转换但返回码为 1（仅警告），
          # 默认 bash -e 会把它当失败，所以 0 和 1 都视为成功，>=2 才是真错误
          set +e
          unzip -q -o "$ZIP" -d /tmp/extracted
          RC=$?
          set -e
          if [ "$RC" -gt 1 ]; then
            echo "::error::解压失败（unzip 退出码 $RC）"; exit 1
          fi

          # 取路径最短的 package.json 作为项目根（兼容 zip 外面多套一层目录）
          PKG=$(find /tmp/extracted -name package.json -not -path '*/node_modules/*' \
                | awk '{print length($0) "\t" $0}' | sort -n | head -n 1 | cut -f2-)
          if [ -z "$PKG" ]; then
            echo "::error::zip 里没有找到 package.json"; exit 1
          fi
          PROJ=$(dirname "$PKG")
          echo "项目目录：$PROJ"

          # 不用 zip 里的 workflow 覆盖本仓库的 workflow
          # （GITHUB_TOKEN 无权推送 .github/workflows 的改动，会导致最后一步 push 失败）
          rm -rf "$PROJ/.github"

          cp -rT "$PROJ" .
          rm -rf node_modules dist android ios

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: 补全通知相关权限
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            if ! grep -q "android.permission.$P" "$MANIFEST"; then
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
            fi
          done

      - name: Sync Capacitor
        run: npx cap sync android

      - name: 缓存 Gradle 安装包
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ runner.os }}-v2

      - name: 预下载 Gradle（多个下载源依次回退）
        working-directory: android
        run: |
          F=gradle/wrapper/gradle-wrapper.properties
          # 精简包即可（-all 带源码文档，体积大）
          sed -i 's/-all\.zip/-bin.zip/' "$F"
          URL=$(grep '^distributionUrl=' "$F" | cut -d= -f2- | tr -d '\\')
          NAME=$(basename "$URL")
          DEST="$HOME/gradle-dist"
          mkdir -p "$DEST"

          ok() { [ -s "$DEST/$NAME" ] && unzip -tq "$DEST/$NAME" >/dev/null 2>&1; }

          if ok; then
            echo "使用缓存的 $NAME"
          else
            rm -f "$DEST/$NAME"
            for BASE in \
              https://services.gradle.org/distributions \
              https://downloads.gradle.org/distributions \
              https://mirrors.cloud.tencent.com/gradle \
              https://repo.huaweicloud.com/gradle; do
              echo "尝试下载：$BASE/$NAME"
              if curl -fL --connect-timeout 20 --max-time 180 --retry 1 --retry-delay 5 --retry-all-errors \
                   -o "$DEST/$NAME" "$BASE/$NAME" && ok; then
                echo "下载成功"
                break
              fi
              rm -f "$DEST/$NAME"
            done
          fi
          ok || { echo "::error::所有 Gradle 下载源都失败了，请稍后重新运行"; exit 1; }

          # 让 wrapper 直接使用本地文件，不再联网下载
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\\\:$DEST/$NAME#" "$F"
          if grep -q '^networkTimeout=' "$F"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$F"
          else
            echo "networkTimeout=180000" >> "$F"
          fi
          cat "$F"

      - name: 配置固定签名与版本号
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          KS="$GITHUB_WORKSPACE/signing/talent-cert.keystore"
          PROP="$GITHUB_WORKSPACE/signing/keystore.properties"
          if [ ! -f "$KS" ] || [ ! -f "$PROP" ]; then
            echo "::error::缺少 signing/talent-cert.keystore 或 signing/keystore.properties，请把 signing 目录一并上传"
            exit 1
          fi
          G=android/app/build.gradle

          # 每次构建用同一把签名，覆盖安装不再提示“签名不一致”
          if ! grep -q 'talent-cert.keystore' "$G"; then
            cat >> "$G" <<'EOF'

          // ---- 固定签名（由工作流追加） ----
          def ksProps = new Properties()
          file("$rootDir/../signing/keystore.properties").withInputStream { ksProps.load(it) }
          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../signing/talent-cert.keystore")
                      storePassword ksProps['storePassword']
                      keyAlias ksProps['keyAlias']
                      keyPassword ksProps['keyPassword']
                      storeType 'pkcs12'
                  }
              }
          }
          EOF
          fi

          # 版本号随构建递增，避免被系统当成“降级”拒绝安装
          sed -i "s/versionCode [0-9][0-9]*/versionCode $RUN_NUMBER/; s/versionName \"[^\"]*\"/versionName \"1.0.$RUN_NUMBER\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "::warning::第 $i 次构建失败，15 秒后重试（多为网络下载超时）"
            sleep 15
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talent-cert-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 提交解压源码并删除 zip
        if: success() && steps.zip.outputs.zip != ''
        env:
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f -- "$ZIP"
          # 确保构建产物目录被忽略（不能在 git add 里用 ':!路径' 排除已被忽略的目录，会报错退出）
          touch .gitignore
          for P in node_modules dist android ios; do
            grep -qxE "/?$P/?" .gitignore || echo "$P/" >> .gitignore
          done
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
          else
            git commit -m "解压源码并删除 zip（构建成功）"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
